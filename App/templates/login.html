{% extends 'base.html' %}

{% block title %}Login - UNISEN{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1 class="login-title">Student Network</h1>
        <p class="login-subtitle">Sign in with your Student ID</p>
        
        <form method="POST" class="login-form">
            <div class="form-group">
                <label for="student_id" class="sr-only">Student ID</label>
                <input type="email" id="student_id" name="student_id" placeholder="student.id@university.edu" required class="form-input">
            </div>
            
            <div class="form-group">
                <label for="password" class="sr-only">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required class="form-input">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>
    </div>
</div>
{% endblock %}
